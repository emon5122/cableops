name: release-please

on:
    push:
        branches:
            - main

permissions:
    contents: write
    issues: write
    pull-requests: write
    actions: write

jobs:
    release-please:
        runs-on: ubuntu-latest
        steps:
            - uses: googleapis/release-please-action@v4
              id: rp
              with:
                  release-type: node
                  token: ${{ github.token }}

            # GITHUB_TOKEN-created PRs trigger no workflows; run CI on the release
            # branch ourselves (workflow_dispatch is allowed from GITHUB_TOKEN).
            - name: Dispatch CI on release PR branch
              if: steps.rp.outputs.prs_created == 'true'
              env:
                  GH_TOKEN: ${{ github.token }}
                  PRS: ${{ steps.rp.outputs.prs }}
              run: |
                  echo "$PRS" | jq -r '.[].headBranchName' | while read -r branch; do
                      echo "Dispatching ci.yml on $branch"
                      gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"
                  done

            - name: Dispatch image build on the new tag
              if: steps.rp.outputs.release_created == 'true'
              env:
                  GH_TOKEN: ${{ github.token }}
                  TAG: ${{ steps.rp.outputs.tag_name }}
              run: gh workflow run docker.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"
